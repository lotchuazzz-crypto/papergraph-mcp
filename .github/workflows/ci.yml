name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.12"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install project
        run: uv sync --locked --dev
      - name: Run tests
        run: uv run pytest -q -p no:cacheprovider

  build:
    name: Build and install wheel
    needs: test
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build distributions
        run: uv build
      - name: Create smoke environment
        run: uv venv .smoke-venv
      - name: Install wheel
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found: {wheels}")
          subprocess.run(
              [
                  "uv",
                  "pip",
                  "install",
                  "--python",
                  ".smoke-venv/bin/python",
                  str(wheels[0]),
              ],
              check=True,
          )
      - name: Verify installed CLI
        run: |
          version="$(.smoke-venv/bin/papergraph-mcp --version)"
          test "$version" = "papergraph-mcp 0.6.0"
