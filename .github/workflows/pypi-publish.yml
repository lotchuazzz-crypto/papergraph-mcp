name: Publish reviewed v1.2.3 to PyPI

# Manual main dispatch and the protected pypi environment are both required.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'lotchuazzz-crypto/papergraph-mcp' }}
    uses: ./.github/workflows/pypi-preparation.yml
    with:
      save_artifacts: true
  verify:
    needs: build
    uses: ./.github/workflows/pypi-artifact-verification.yml
    with:
      artifact_id: ${{ needs.build.outputs.artifact_id }}
      producer_run_id: ${{ needs.build.outputs.producer_run_id }}
  publish:
    name: Publish approved distributions
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'lotchuazzz-crypto/papergraph-mcp' }}
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/papergraph-mcp
    permissions:
      id-token: write
    steps:
      - name: Retrieve this run's verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          digest-mismatch: error
      - name: Recheck approved bytes after approval
        env:
          PRODUCER_RUN_ID: ${{ needs.build.outputs.producer_run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          producer = os.environ['PRODUCER_RUN_ID']
          if not producer.isdecimal() or int(producer) <= 0 or producer != os.environ['GITHUB_RUN_ID']:
              raise SystemExit('Distributions must come from the same workflow run')
          approved = {
              'papergraph_mcp-1.2.3-py3-none-any.whl': '25ad4ec7632bbd0f166e1d9a0508885ce2fe0125b620801f1b41c4d53bd93474',
              'papergraph_mcp-1.2.3.tar.gz': '140c0aca282f87b431fcea984ed357024a7f368399195a214eb56f745cf2f153',
          }
          files = list(Path('dist').iterdir())
          if {path.name for path in files} != set(approved) or any(path.is_symlink() or not path.is_file() for path in files):
              raise SystemExit('Expected exactly the two approved distributions')
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != approved[path.name]:
                  raise SystemExit(f'SHA-256 mismatch: {path.name}')
              print(f'{path.name}: {digest}')
          PY
      - name: Publish to public PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
          repository-url: https://upload.pypi.org/legacy/
          verify-metadata: true
          skip-existing: false
          attestations: true
          print-hash: true
