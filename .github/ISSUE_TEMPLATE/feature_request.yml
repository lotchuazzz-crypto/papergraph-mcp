name: Feature request
description: Suggest a focused improvement to PaperGraph.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What research or development task is currently difficult?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the observable behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other designs have you considered?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add public examples or related links without private paper content.
    validations:
      required: false
