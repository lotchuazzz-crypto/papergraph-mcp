[project]
name = "papergraph-mcp"
version = "0.6.1"
description = "Turn mathematical LaTeX papers into theorem dependency graphs for AI agents."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "arxiv", "latex", "mathematics", "theorem-graph", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx>=0.27,<1",
    "mcp[cli]>=2,<3",
    "pybtex>=0.25,<0.27",
    "PyMuPDF>=1.24,<2",
]

[project.scripts]
papergraph-mcp = "papergraph.server:main"

[project.urls]
Homepage = "https://github.com/lotchuazzz-crypto/papergraph-mcp"
Repository = "https://github.com/lotchuazzz-crypto/papergraph-mcp"
Issues = "https://github.com/lotchuazzz-crypto/papergraph-mcp/issues"
Releases = "https://github.com/lotchuazzz-crypto/papergraph-mcp/releases"

[dependency-groups]
dev = [
    "pyyaml>=6,<7",
    "pytest>=8",
    "tomli>=2,<3; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papergraph"]
